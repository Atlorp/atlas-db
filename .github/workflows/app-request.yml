name: App Request

on:
  issues:
    types:
      - opened

  workflow_dispatch:
    inputs:
      issue_number:
        description: "what issue number twin"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  app-request:
    runs-on: ubuntu-latest

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get issue data (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue view "$ISSUE_NUMBER" \
            --json body,title,author \
            > issue-data.json
          echo "ISSUE_BODY<<EOF" >> "$GITHUB_ENV"
          jq -r '.body' issue-data.json >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "ISSUE_USER=$(jq -r '.author.login' issue-data.json)" >> "$GITHUB_ENV"
          echo "ISSUE_TITLE=$(jq -r '.title' issue-data.json)" >> "$GITHUB_ENV"
      - name: Get issue data (automatic run)
        if: github.event_name == 'issues'
        run: |
          echo "ISSUE_BODY<<EOF" >> "$GITHUB_ENV"
          echo '${{ github.event.issue.body }}' >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "ISSUE_USER=${{ github.event.issue.user.login }}" >> "$GITHUB_ENV"
          echo "ISSUE_TITLE=${{ github.event.issue.title }}" >> "$GITHUB_ENV"
      - name: Extract JSON attachment
        id: json
        env:
          ISSUE_BODY: ${{ env.ISSUE_BODY }}
        run: |
          echo "$ISSUE_BODY" > issue.txt
          URL=$(grep -oE 'https://[^ )"]+\.json' issue.txt | head -1)
          if [ -z "$URL" ]; then
            echo "No JSON attachment found"
            exit 1
          fi
          NAME=$(basename "$URL")
          if ! echo "$NAME" | grep -qE '^[a-z0-9-]+\.json$'; then
            echo "Invalid filename: $NAME"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Download JSON
        run: |
          mkdir -p source/apps
          curl -L \
            "${{ steps.json.outputs.url }}" \
            -o "source/apps/${{ steps.json.outputs.name }}"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"
          cache-dependency-path: source/requirements.txt

      - name: Install requirements
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test generator priority
        working-directory: source
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate.py -t "$TOKEN" -p
      - name: Reset repository
        run: |
          git reset --hard
          git clean -fdx
      - name: Restore submitted JSON
        run: |
          mkdir -p source/apps
          curl -L \
            "${{ steps.json.outputs.url }}" \
            -o "source/apps/${{ steps.json.outputs.name }}"
      - name: Create branch
        run: |
          git checkout -b "app-request-${ISSUE_NUMBER}"
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "source/apps/${{ steps.json.outputs.name }}"
          git commit \
            -m "Add ${{ steps.json.outputs.name }}"
      - name: Push branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --force origin "app-request-${ISSUE_NUMBER}"
      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            if gh pr create \
              --title "Add ${{ steps.json.outputs.name }}" \
              --body "generated from #${ISSUE_NUMBER}. Submitted by @${ISSUE_USER}" \
              --base main \
              --head "app-request-${ISSUE_NUMBER}"; then
              exit 0
            fi
            echo "PR creation failed (attempt $i), retrying in 5s..."
            sleep 5
          done
          echo "Failed to create PR after 5 attempts"
          exit 1

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment \
            "$ISSUE_NUMBER" \
            --body "@${ISSUE_USER} we made a pull request from this app request."
