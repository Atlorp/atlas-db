name: App Request

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  app-request:
    if: contains(github.event.issue.title, '')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract JSON attachment
        id: json
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "$ISSUE_BODY" > issue.txt

          URL=$(grep -oE 'https://[^ )]+\.json' issue.txt | head -1)

          if [ -z "$URL" ]; then
            echo "No JSON attachment found"
            exit 1
          fi

          NAME=$(basename "$URL")

          if ! echo "$NAME" | grep -qE '^[a-z0-9-]+\.json$'; then
            echo "Invalid filename: $NAME"
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Download JSON
        run: |
          mkdir -p source/apps

          curl -L \
            "${{ steps.json.outputs.url }}" \
            -o "source/apps/${{ steps.json.outputs.name }}"

      - name: Check developer permission
        run: |
          if ! grep -qi "I am the app developer or have permission" issue.txt; then
            echo "Developer permission checkbox was not accepted"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requirements
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test generator priority
        working-directory: source
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate.py -t "$TOKEN" -p

      # Remove generated files and return to clean state
      - name: Reset repository
        run: |
          git reset --hard
          git clean -fdx

      - name: Restore submitted JSON
        run: |
          mkdir -p source/apps

          curl -L \
            "${{ steps.json.outputs.url }}" \
            -o "source/apps/${{ steps.json.outputs.name }}"

      - name: Create branch
        run: |
          git checkout -b \
            app-request-${{ github.event.issue.number }}

      - name: Commit app
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add \
            "source/apps/${{ steps.json.outputs.name }}"

          git commit \
            -m "Add ${{ steps.json.outputs.name }}"

      - name: Push branch
        run: |
          git push origin \
            app-request-${{ github.event.issue.number }}

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Add ${{ steps.json.outputs.name }}" \
            --body "Automatically generated from #${{ github.event.issue.number }}.

Submitted by @${{ github.event.issue.user.login }}" \
            --base main \
            --head app-request-${{ github.event.issue.number }}

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment \
            ${{ github.event.issue.number }} \
            --body "@${{ github.event.issue.user.login }} your app request has been converted into a pull request."
