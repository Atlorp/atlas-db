name: Update sources

on:
  schedule:
    - cron: 0 0,6,12,18 * * *
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    container: universalteam/db

    steps:
    - uses: actions/checkout@v6
    
    - name: sync from uni db
      run: |
        set -e

        UPSTREAM_REPO="https://github.com/Universal-Team/db.git"
        TMP_DIR=$(mktemp -d)

        git clone --depth=1 "$UPSTREAM_REPO" "$TMP_DIR"

        echo "app sync"
        mkdir -p source/apps
        mkdir -p conflicts/source/apps

        find "$TMP_DIR/source/apps" -type f | while read file; do
          rel="${file#$TMP_DIR/source/apps/}"
          local_file="source/apps/$rel"
          conflict_file="conflicts/source/apps/$rel"

          if [ ! -f "$local_file" ]; then
            mkdir -p "$(dirname "$local_file")"
            cp "$file" "$local_file"
          else
            if ! cmp -s "$file" "$local_file"; then
              mkdir -p "$(dirname "$conflict_file")"
              cp "$file" "$conflict_file"
            fi
          fi
        done

        echo "screenshot sync"
        mkdir -p docs/assets/images/screenshots
        mkdir -p conflicts/docs/assets/images/screenshots

        find "$TMP_DIR/docs/assets/images/screenshots" -type f | while read file; do
          rel="${file#$TMP_DIR/docs/assets/images/screenshots/}"
          local_file="docs/assets/images/screenshots/$rel"
          conflict_file="conflicts/docs/assets/images/screenshots/$rel"

          if [ ! -f "$local_file" ]; then
            mkdir -p "$(dirname "$local_file")"
            cp "$file" "$local_file"
          else
            if ! cmp -s "$file" "$local_file"; then
              mkdir -p "$(dirname "$conflict_file")"
              cp "$file" "$conflict_file"
            fi
          fi
        done

        rm -rf "$TMP_DIR"

    - name: Delete old pages and QRs
      run: rm -rf docs/_3ds/* docs/_ds/* docs/assets/images/qr/*.png docs/assets/images/qr/git/*.png docs/assets/images/qr/prerelease/*.png

    - name: Run generate.py
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: |
        export PATH=$PATH:/opt/devkitpro/tools/bin

        # Check for background images
        BG_DIR=source/bg/$(date +%m)
        COUNT=$(ls $BG_DIR | wc -l)
        if [ $COUNT -ne 0 ]; then
          SELECTED=$(( $(date +%-j) / 3 % $COUNT + 1 ))
          BG="$BG_DIR/$(ls $BG_DIR | head -n$SELECTED | tail -n1)"

          python3 source/generate.py all --background "$BG"
        else
          python3 source/generate.py all
        fi

    - name: github pages
      uses: actions/configure-pages@v5

    - name: upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs


  deploy:
    needs: run
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
